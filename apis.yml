aid: venova-medical
name: Venova Medical
description: 'Venova Medical, Inc. is a privately held, clinical-stage medical device
  company in Los Gatos, California, developing minimally invasive vascular access
  technology for patients on hemodialysis. Its Velocity Percutaneous AVF System is
  a next-generation percutaneous arteriovenous fistula (pAVF) device intended to create
  a functional dialysis access with fewer reinterventions and faster maturation than
  a surgically created fistula, targeting the stenosis at the artery-vein junction
  that is the most common barrier to AVF success. The company is running the VENOS
  clinical program (VENOS-2 early feasibility, VENOS-3 IDE pivotal) toward FDA approval;
  the Velocity System remains investigational and is not FDA cleared or approved. Venova
  is backed by ShangBay Capital, Banyan Pacific, Aphelion Capital, Cardeation, Kofa
  Healthcare, Catalyst Health Ventures, Cadence Growth Capital and Mirae Asset Capital
  Life Science. Venova publishes no public API, developer portal, SDK or machine-readable
  specification: it is a physical medical device manufacturer, not a software provider.'
